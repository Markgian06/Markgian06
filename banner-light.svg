<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Mark Gian Abejero" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0369a1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0369a1" fill-opacity="0.18"/>
    </pattern>
    <clipPath id="round">
      <rect width="1000" height="260" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#dots)"/>

    <!-- floating glows -->
    <circle cx="860" cy="60" r="90" fill="#0369a1" fill-opacity="0.08">
      <animate attributeName="cy" values="60;85;60" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="190" r="60" fill="#0369a1" fill-opacity="0.07">
      <animate attributeName="cx" values="120;160;120" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- animated waves -->
    <g transform="translate(0,15)">
      <path fill="#38bdf8" fill-opacity="0.40" d="M0 200 c125 -40 375 40 500 0 c125 -40 375 40 500 0 c125 -40 375 40 500 0 c125 -40 375 40 500 0 V260 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(0,32)">
      <path fill="#0369a1" fill-opacity="0.30" d="M0 200 c125 -40 375 40 500 0 c125 -40 375 40 500 0 c125 -40 375 40 500 0 c125 -40 375 40 500 0 V260 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="14s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- text -->
    <g text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <text x="500" y="112" font-size="48" font-weight="800" letter-spacing="5" fill="#0f172a">MARK GIAN ABEJERO</text>
      <text x="500" y="148" font-size="15" font-weight="500" letter-spacing="4" fill="#0369a1">BACHELOR OF SCIENCE IN INFORMATION SYSTEMS</text>
      <rect x="380" y="166" width="240" height="2" fill="url(#accent)"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="259" rx="18" fill="none" stroke="#bae6fd"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
